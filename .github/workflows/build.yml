# GitHub Actions workflow for building, testing, verifying, and preparing plugin release drafts.
# Modeled on https://github.com/JetBrains/intellij-platform-plugin-template `.github/workflows/build.yml`.
#
# - Build the plugin ZIP with the `buildPlugin` task and upload it as a workflow artifact.
# - Run unit, integration, Agent premain, and headless UI tests.
# - Run `verifyPlugin` and upload Plugin Verifier reports.
# - Create a draft GitHub release on non-pull-request runs.
#
# GitHub Actions reference: https://docs.github.com/actions

name: Build
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew :plugin:buildPlugin --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: plugin/build/distributions/*.zip

  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run Tests
        run: >-
          ./gradlew forbiddenApiScan unitTest integrationTest ideaUiTest
          --continue
          --no-configuration-cache
          --console=plain

      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-result
          path: |
            **/build/reports/tests
            **/build/test-results
          retention-days: 7
          if-no-files-found: ignore

  agent-matrix:
    name: Agent JDK ${{ matrix.agent-jdk }}
    needs: [ build ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent-jdk: [ 8, 11, 17, 21 ]
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          # Last version becomes JAVA_HOME. Gradle 9 must run on 21; the
          # matrix JDK is used only for the Agent child process via toolchain.
          java-version: |
            ${{ matrix.agent-jdk }}
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Agent integration tests
        run: ./gradlew :integration-tests:test -PagentJdk=${{ matrix.agent-jdk }} --no-configuration-cache --console=plain

  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run Plugin Verification tasks
        run: ./gradlew :plugin:verifyPlugin --console=plain

      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pluginVerifier-result
          path: plugin/build/reports/pluginVerifier
          retention-days: 7
          if-no-files-found: ignore

  releaseDraft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build, test, verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            DRAFT="$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo true)"
            if [ "$DRAFT" != "true" ]; then
              echo "Release $VERSION is already published; skipping draft creation"
              exit 0
            fi
          fi
          mkdir -p build/tmp
          RELEASE_NOTE="./build/tmp/release_note.txt"
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file="$RELEASE_NOTE" || true
          if [ ! -s "$RELEASE_NOTE" ]; then
            echo "Runtime Pivot ${VERSION}" > "$RELEASE_NOTE"
          fi
          gh release create "$VERSION" \
            --draft \
            --title "$VERSION" \
            --notes-file "$RELEASE_NOTE" \
            --target "$GITHUB_SHA"
