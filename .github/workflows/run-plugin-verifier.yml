# IntelliJ Plugin Verifier. Also runs as the `verify` job in build.yml.
# Kept as a standalone workflow for on-demand / weekly runs.

name: Run Plugin Verifier
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Plugin Verification tasks
        run: ./gradlew :plugin:verifyPlugin -Dplugin.verifier.home.dir=~/.pluginVerifier --console=plain

      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pluginVerifier-result
          path: plugin/build/reports/pluginVerifier
          retention-days: 7
          if-no-files-found: ignore
