# Headless Swing/UI component tests (`ideaUiTest`) on Linux, Windows, and macOS.
# These do not start a RemoteRobot server. Modeled on the JetBrains plugin template UI test job split.

name: Run UI Tests
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  ideaUiTest:
    name: UI tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run headless Swing/UI component tests
        shell: bash
        run: ./gradlew ideaUiTest --no-configuration-cache --console=plain

      - name: Upload UI test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report-${{ matrix.os }}
          path: |
            **/build/reports/tests
            **/build/test-results
          retention-days: 7
          if-no-files-found: ignore
