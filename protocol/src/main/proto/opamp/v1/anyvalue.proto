// Vendored from https://github.com/open-telemetry/opamp-spec proto/opamp/v1/anyvalue.proto
// Local additions: java_package / java_multiple_files for the Runtime Pivot Java 8 protocol module.

syntax = "proto3";

package opamp.proto.v1;

option go_package = "github.com/open-telemetry/opamp-go/protobufs";
option csharp_namespace = "OpAmp.Proto.V1";
option java_package = "opamp.proto.v1";
option java_outer_classname = "AnyValueProto";
option java_multiple_files = true;

message AnyValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    double double_value = 4;
    ArrayValue array_value = 5;
    KeyValueList kvlist_value = 6;
    bytes bytes_value = 7;
  }
}

message ArrayValue {
  repeated AnyValue values = 1;
}

message KeyValueList {
  repeated KeyValue values = 1;
}

message KeyValue {
  string key = 1;
  AnyValue value = 2;
}
